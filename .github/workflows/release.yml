name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: ver
        run: |
          CODE=$(awk -F'=' '/versionCode/ { gsub(/ /,"",$2); print $2; exit }' app/build.gradle.kts)
          NAME=$(awk -F'"' '/versionName/ { print $2; exit }' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists, skip."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.existing.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: steps.existing.outputs.exists != 'true'

      - name: Disable local proxy for CI
        if: steps.existing.outputs.exists != 'true'
        run: |
          sed -i '/[Pp]roxy/d' gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Write signing files
        if: steps.existing.outputs.exists != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "缺少 GitHub Secrets：RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/kcb-release.jks
          printf 'storeFile=keystore/kcb-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          name = "${{ steps.ver.outputs.name }}"
          code = "${{ steps.ver.outputs.code }}"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8") if Path("CHANGELOG.md").exists() else ""
          match = re.search(rf"(?ms)^##\s+{re.escape(name)}\s*\n(.*?)(?=^##\s|\Z)", text)
          notes = ""
          if match:
              notes = re.sub(r"^(versionCode|versionName)\s*=.*\n?", "", match.group(1), flags=re.M).strip()
          if not notes:
              notes = "修复与改进。"
          Path("release-notes.txt").write_text(
              f"versionCode={code}\nversionName={name}\n\n{notes}\n",
              encoding="utf-8",
          )
          PY
          APK="app/build/outputs/apk/release/app-release.apk"
          OUT="sysukcb-${{ steps.ver.outputs.name }}.apk"
          cp "$APK" "$OUT"
          gh release create "${{ steps.ver.outputs.tag }}" "$OUT" \
            --title "课程表D ${{ steps.ver.outputs.name }}" \
            --latest \
            --notes-file release-notes.txt

      - name: Upload APK to DogeCloud OSS
        if: steps.existing.outputs.exists != 'true'
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_AUTH_KEY: ${{ secrets.DOGECLOUD_AUTH_KEY }}
          DOGECLOUD_BUCKET: ${{ vars.DOGECLOUD_BUCKET }}
          DOGECLOUD_DIRECTORY: ${{ vars.DOGECLOUD_DIRECTORY }}
          DOGECLOUD_DOMAIN: ${{ vars.DOGECLOUD_DOMAIN }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          APK_PATH: sysukcb-${{ steps.ver.outputs.name }}.apk
        run: |
          python3 -m pip install --quiet boto3
          python3 .github/scripts/upload_dogecloud.py

      - name: Attach COS download URL to Release
        if: steps.existing.outputs.exists != 'true' && env.COS_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COS_URL: ${{ env.COS_URL }}
        run: |
          python3 << 'PY'
          import os
          from pathlib import Path
          notes = Path("release-notes.txt").read_text(encoding="utf-8")
          url = os.environ.get("COS_URL", "").strip()
          if url and "cosUrl=" not in notes:
              lines = notes.splitlines()
              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("versionName="):
                      insert_at = i + 1
                      break
              lines.insert(insert_at, f"cosUrl={url}")
              Path("release-notes.txt").write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY
          gh release edit "${{ steps.ver.outputs.tag }}" --notes-file release-notes.txt
